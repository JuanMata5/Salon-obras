<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Obras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="admin-label">Administración</p>
          <h1>Panel de obras</h1>
        </div>
        <div class="admin-header-actions">
          <a class="admin-link" href="/">Volver al sitio</a>
          <button class="action-btn" id="admin-logout" type="button">Cerrar sesión</button>
        </div>
      </header>

      <main class="admin-main">
        <section class="stats-grid">
          <article class="stat-card">
            <span>Total</span>
            <strong id="stat-total">0</strong>
          </article>
          <article class="stat-card">
            <span>Pendientes</span>
            <strong id="stat-pending">0</strong>
          </article>
          <article class="stat-card">
            <span>Aprobadas</span>
            <strong id="stat-approved">0</strong>
          </article>
          <article class="stat-card">
            <span>Rechazadas</span>
            <strong id="stat-rejected">0</strong>
          </article>
        </section>

        <section class="admin-table-wrap">
          <div class="table-header">
            <h2>Obras recibidas</h2>
          </div>
          <div id="admin-list" class="admin-list"></div>
        </section>
      </main>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
